<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050509">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Planner">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Personal Planner</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=13">
  </head>
  <body class="app-loading">
    <div class="app-shell">
      <main id="app" class="app-main" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active" type="button" data-tab="dashboard" aria-label="Dashboard">
          <span class="nav-icon" data-icon="grid"></span>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" type="button" data-tab="tasks" aria-label="Tasks">
          <span class="nav-icon" data-icon="check"></span>
          <span>Tasks</span>
        </button>
        <button class="nav-item" type="button" data-tab="finance" aria-label="Finance">
          <span class="nav-icon" data-icon="wallet"></span>
          <span>Finance</span>
        </button>
        <button class="nav-item" type="button" data-tab="school" aria-label="School">
          <span class="nav-icon" data-icon="book"></span>
          <span>School</span>
        </button>
        <button class="nav-item" type="button" data-tab="more" aria-label="More">
          <span class="nav-icon" data-icon="more"></span>
          <span>More</span>
        </button>
      </nav>
    </div>

    <div class="app-loader" aria-hidden="true">
      <div class="loader-panel">
        <span class="loader-label">Planner</span>
        <span class="loader-track"><span></span></span>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js?v=13"></script>
  </body>
</html>
